kind = "web"
previewPath = "/"
title = "Premium Wallet Sync"
description = "A mobile-first cryptocurrency wallet dashboard imported from the premium-wallet-sync GitHub repository, with USDT balance, deposit, withdrawal, and transaction history screens."
version = "1.0.0"
id = "artifacts/premium-wallet-sync"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18646

[services.development]
run = "pnpm --filter @workspace/premium-wallet-sync run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/premium-wallet-sync", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/premium-wallet-sync", "run", "serve"]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "18646"
BASE_PATH = "/"
