kind = "web"
previewPath = "/"
title = "Premium Wallet Sync"
description = "A mobile-first cryptocurrency wallet dashboard imported from the premium-wallet-sync GitHub repository, with USDT balance, deposit, withdrawal, and transaction history screens."
version = "1.0.0"
id = "artifacts/premium-wallet-sync"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18646

[services.development]
run = "pnpm --filter @workspace/premium-wallet-sync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/premium-wallet-sync", "run", "build" ]
serve = "static"
publicDir = "artifacts/premium-wallet-sync/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18646"
BASE_PATH = "/"
